<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Idade</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>

<form action="script.php" method="post">

    <label for="nome">Digite seu nome:</label>
    <input type="text" id="nome" name="nome" placeholder="Fulano" required>

    <label for="dataNasc">Preencha sua data de nascimento:</label>
    <input type="date" id="dataNasc" name="dataNasc" required>

    <label for="cidade">Cidade que mora:</label>
    <input type="text" id="cidade" name="cidade" required>

    <label for="estadosVisitados">Selecione os estados que já visitou:</label>
    <select id="estadosVisitados" name="estadosVisitados[]" multiple>
        <option value="RJ">Rio de Janeiro</option>
        <option value="SP">São Paulo</option>
        <option value="ES">Espirito Santo</option>
        <option value="MG">Minas Gerais</option>
        <option value="BA">Bahia</option>
    </select>

    <button type="submit">Enviar</button>

</form>

</body>
</html>
